server.port=8080

# ---- MySQL (database is auto-created if missing) ----
spring.datasource.url=jdbc:mysql://localhost:3306/staysafe?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sarfaraj7520

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (secret must be >= 32 chars; override in production) ----
app.jwt.secret=${JWT_SECRET:staysafe-super-secret-key-change-me-please-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- KYC ----
# Secret used to HMAC government ID numbers (only the hash + masked value are stored). Change in production.
app.kyc.hash-secret=${KYC_HASH_SECRET:change-this-kyc-secret-before-production-0123456789}

# ---- File uploads (profile photos, property photos) ----
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# ---- Razorpay (use TEST keys from the Razorpay dashboard while developing) ----
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.api-base=https://api.razorpay.com/v1

# ---- DigiLocker requester integration ----
# Obtain production credentials only after DigiLocker requester onboarding/approval.
# Never commit client secrets. Register this exact callback URI with DigiLocker.
digilocker.client-id=${DIGILOCKER_CLIENT_ID:}
digilocker.client-secret=${DIGILOCKER_CLIENT_SECRET:}
digilocker.redirect-uri=${DIGILOCKER_REDIRECT_URI:http://localhost:8080/api/kyc/digilocker/callback}
digilocker.authorize-uri=${DIGILOCKER_AUTHORIZE_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/authorize}
digilocker.token-uri=${DIGILOCKER_TOKEN_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/token}
digilocker.user-uri=${DIGILOCKER_USER_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/user}
digilocker.issued-documents-uri=${DIGILOCKER_ISSUED_DOCUMENTS_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/2/files/issued}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ---- SMTP email delivery (required for OTP and booking confirmations) ----
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${MAIL_ENABLED:false}

# Persistent JWT session (seven days by default; configure a strong secret in production).

# Private property-document storage (never exposed through the public image endpoint)
app.private-document.dir=${PRIVATE_DOCUMENT_DIR:./private-documents}
